name: Build and Deploy Dist

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Instalar dependencias
        run: npm install

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Subir dist a rama build
        run: |
          # cambiar/crear rama build
          git checkout -B build

          # eliminar archivos versionados (sin romper .git)
          git rm -rf . > /dev/null 2>&1 || true

          # mover dist al root
          mv dist/* .
          rm -rf dist

          # agregar y commit
          git add .
          git diff --cached --quiet || git commit -m "Deploy build"

          # push forzado a rama build
          git push origin build --force
