name: Build and Deploy Dist

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Instalar dependencias
        run: npm install

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Subir dist a rama build
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git checkout -B build

          # guardar package.json antes de limpiar
          cp package.json /tmp/package.json
          cp package-lock.json /tmp/package-lock.json 2>/dev/null || true

          git rm -rf . > /dev/null 2>&1 || true

          # restaurar archivos necesarios
          cp /tmp/package.json .
          cp /tmp/package-lock.json . 2>/dev/null || true

          # mover dist
          mv dist/* .
          rm -rf dist

          git add .
          git diff --cached --quiet || git commit -m "Deploy build"

          git push origin build --force
