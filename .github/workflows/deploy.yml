name: Build and Deploy Dist

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Instalar dependencias
        run: npm install

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Subir dist a rama build
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # guardar dist y package.json
          cp -r dist /tmp/dist
          cp package.json /tmp/package.json
          cp package-lock.json /tmp/package-lock.json 2>/dev/null || true

          # cambiar a rama build
          git checkout -B build

          # limpiar repo
          git rm -rf . > /dev/null 2>&1 || true

          # restaurar archivos necesarios
          cp -r /tmp/dist/* .
          cp /tmp/package.json .
          cp /tmp/package-lock.json . 2>/dev/null || true

          # agregar y commit
          git add .
          git diff --cached --quiet || git commit -m "Deploy build"

          # push
          git push origin build --force
